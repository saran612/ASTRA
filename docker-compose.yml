version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fdr_vault_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fdr_vault
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Prototype-only local SMTP server for alert escalation inspection
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: fdr_vault_mailhog
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP (prototype-only)
      - "8026:8025" # Web UI (prototype-only)

volumes:
  pgdata:
